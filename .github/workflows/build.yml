name: Build CarrierSpoof APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Xposed API stub jar (compile-time only, never packaged)
        run: |
          mkdir -p app/libs stub-classes
          find stub -name '*.java' > stub-sources.txt
          javac -d stub-classes @stub-sources.txt
          jar cf app/libs/xposed-stub.jar -C stub-classes .

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarrierSpoof-debug
          path: app/build/outputs/apk/debug/app-debug.apk
