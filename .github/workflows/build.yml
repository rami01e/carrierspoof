name: Build CarrierSpoof APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile Xposed API stub jar (compile-time only, never packaged)
        run: |
          mkdir -p app/libs stub-classes
          find stub -name '*.java' > stub-sources.txt
          javac -d stub-classes @stub-sources.txt
          jar cf app/libs/xposed-stub.jar -C stub-classes .

      - name: Compile Xposed API stub jar
        run: |
          mkdir -p app/libs stub-classes
          find stub -name '*.java' -print > stub-sources.txt
          test -s stub-sources.txt
          javac -d stub-classes @stub-sources.txt
          jar cf app/libs/xposed-stub.jar -C stub-classes .
          jar tf app/libs/xposed-stub.jar \
            | grep -qx 'de/robv/android/xposed/XSharedPreferences.class'

      - name: Generate release keystore (if missing)
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias carrierspoof \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass carrierspoof -keypass carrierspoof \
              -dname "CN=CarrierSpoof, OU=KiMeRa, O=KiMeRa, C=US"
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarrierSpoof-release
          path: app/build/outputs/apk/release/app-release.apk
