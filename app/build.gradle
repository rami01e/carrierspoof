plugins { id 'com.android.application' }

android {
    namespace 'dev.local.carrierspoof'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.local.carrierspoof'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint { abortOnError false }
}

dependencies {
    compileOnly 'io.github.libxposed:api:101'      // modern API-101 entry (MainHook)
    compileOnly 'de.robv.android.xposed:api:82'    // legacy fallback (LegacyHook) + XSharedPreferences
}
