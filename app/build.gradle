plugins { id 'com.android.application' }

android {
    namespace 'com.kimera.carrierspoof'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kimera.carrierspoof'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.keystore')
            storePassword 'carrierspoof'
            keyAlias 'carrierspoof'
            keyPassword 'carrierspoof'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint { abortOnError false }
}

dependencies {
    // de.robv.android.xposed:api:82 is no longer hosted anywhere reachable
    // (Bintray died in 2021). The workflow compiles our stub from /stub/ and
    // drops it here. compileOnly = never packaged; runtime uses Vector's classes.
    compileOnly files('libs/xposed-stub.jar')
}
