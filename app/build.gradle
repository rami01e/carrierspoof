plugins { id 'com.android.application' }

android {
    namespace 'com.kimera.carrierspoof'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kimera.carrierspoof'
        minSdk 29
        targetSdk 34
        versionCode 122
        versionName "1.22"
    }

    signingConfigs {
        release {
            storeFile file('../keystore/release.keystore')
            storePassword 'carrierspoof'
            keyAlias 'carrierspoof'
            keyPassword 'carrierspoof'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint { abortOnError false }
}

dependencies {
    compileOnly files('libs/xposed-stub.jar')
}
